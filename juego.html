<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>1v1.lol Clone - Ultra Stable</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; background: #000; user-select: none; }
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        #health-container { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); width: 300px; height: 20px; background: rgba(0,0,0,0.5); border: 2px solid white; border-radius: 10px; overflow: hidden; }
        #health-bar { width: 100%; height: 100%; background: #2ecc71; transition: width 0.3s; }
        #stats { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); color: white; font-size: 20px; font-weight: bold; text-align: center; text-shadow: 2px 2px 4px black; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 12px; height: 12px; border: 2px solid lime; border-radius: 50%; transform: translate(-50%, -50%); }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000 !important; text-align: center; pointer-events: auto !important; }
        .hidden { display: none !important; }
        #main-menu h1 { font-size: 70px; margin-bottom: 20px; color: #f1c40f; text-shadow: 0 0 20px rgba(241, 196, 15, 0.5); }
        .btn { padding: 15px 40px; font-size: 24px; cursor: pointer; background: #f1c40f; border: none; color: #2c3e50; border-radius: 8px; font-weight: bold; transition: 0.2s; margin: 10px; position: relative; z-index: 1100 !important; pointer-events: auto !important; }
        .btn:hover { background: #f39c12; transform: scale(1.05); }
        #settings-menu { background: rgba(20,20,20,0.95); }
        .setting-row { margin: 15px 0; font-size: 20px; display: flex; align-items: center; gap: 20px; }
        #build-menu { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 10; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 15px; backdrop-filter: blur(5px); }
        #inventory { position: absolute; bottom: 30px; right: 30px; display: flex; gap: 15px; z-index: 10; }
        .inv-slot {
            width: 70px; height: 70px;
            background: linear-gradient(145deg, rgba(40,40,40,0.9), rgba(20,20,20,0.9));
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            color: white; font-size: 11px; font-weight: bold;
            text-align: center; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .inv-slot .icon { font-size: 24px; margin-bottom: 5px; }
        .inv-slot.active {
            border-color: #f1c40f;
            background: linear-gradient(145deg, rgba(241, 196, 15, 0.4), rgba(211, 175, 55, 0.2));
            transform: scale(1.1) translateY(-10px);
            box-shadow: 0 0 20px rgba(241, 196, 15, 0.5);
        }
        #status-bars { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); width: 350px; display: flex; flex-direction: column; gap: 8px; }
        .bar-container { width: 100%; height: 18px; background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.3); border-radius: 10px; overflow: hidden; position: relative; }
        .bar { height: 100%; transition: width 0.2s ease-out; }
        #health-bar { width: 100%; background: linear-gradient(90deg, #2ecc71, #27ae60); }
        #shield-bar { width: 100%; background: linear-gradient(90deg, #3498db, #2980b9); }
        .bar-label { position: absolute; width: 100%; text-align: center; color: white; font-size: 12px; font-weight: bold; line-height: 18px; text-shadow: 1px 1px 2px black; pointer-events: none; }
        #kill-feed { position: absolute; top: 20px; right: 20px; color: white; text-align: right; font-size: 18px; font-weight: bold; text-shadow: 2px 2px 4px black; }
        .build-btn { padding: 10px; background: rgba(255,255,255,0.1); color: white; border: 2px solid rgba(255,255,255,0.5); cursor: pointer; border-radius: 5px; width: 80px; text-align: center; font-size: 12px; }
        .build-btn.active { background: #3498db; border-color: #fff; }
    </style>
</head>
<body>
    <div id="hud">
        <div id="status-bars">
            <div class="bar-container">
                <div id="shield-bar" class="bar"></div>
                <div class="bar-label">ESCUDO</div>
            </div>
            <div class="bar-container">
                <div id="health-bar" class="bar"></div>
                <div class="bar-label">SALUD</div>
            </div>
        </div>
        <div id="stats">Materiales: <span id="mats">500</span> | Kills: <span id="kills">0</span> | Construyendo: <span id="build-name">Pared</span></div>
        <div id="crosshair"></div>
    </div>
    <div id="kill-feed"></div>

    <div id="inventory">
        <div id="slot-1" class="inv-slot active">
            <span class="icon">🔫</span>
            <span>Pistola</span>
        </div>
        <div id="slot-2" class="inv-slot">
            <span class="icon">💥</span>
            <span>Escopeta</span>
        </div>
        <div id="slot-3" class="inv-slot">
            <span class="icon">🎯</span>
            <span>Fusil</span>
        </div>
    </div>


    <div id="main-menu" class="overlay">
        <h1>1v1.lol JS</h1>
        <button id="play-btn" class="btn" onclick="handlePlay()">JUGAR</button>
        <button id="open-settings-btn" class="btn" onclick="handleSettings()">AJUSTES</button>
    </div>

    <div id="settings-menu" class="overlay hidden">
        <h1>AJUSTES</h1>
        <div class="setting-row">
            <span>Sensibilidad: </span>
            <input type="range" id="sens-slider" min="1" max="10" value="5">
        </div>
        <button id="close-settings-btn" class="btn" onclick="handleCloseSettings()">GUARDAR Y VOLVER</button>
    </div>

    <div id="game-over" class="overlay hidden">
        <h1>HAS MUERTO</h1>
        <p id="final-stats">Kills: 0</p>
        <button id="restart-btn" class="btn" onclick="location.reload()">REINTENTAR</button>
    </div>

    <div id="build-menu">
        <button class="build-btn active" id="btn-wall" onclick="setBuild('wall')">1. PARED</button>
        <button class="build-btn" id="btn-floor" onclick="setBuild('floor')">2. SUELO</button>
        <button class="build-btn" id="btn-ramp" onclick="setBuild('ramp')">3. RAMPA</button>
        <button class="build-btn" id="btn-cone" onclick="setBuild('cone')">4. CONO</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Variables Globales
        let scene, camera, renderer, player, gun;
        let cameraPivot;
        let isLocked = false;
        let moveF = false, moveB = false, moveL = false, moveR = false;
        let health = 100, shield = 100, materials = 500;
        let kills = 0;
        let isSprinting = false, isCrouching = false;
        let ghostMesh;
        let currentBuild = 'wall';
        let currentWeapon = 'pistol';
        let isBuildingMode = false; // Nueva variable para controlar la visibilidad del ghost
        let buildGeometries = {}; // Pre-created geometries to avoid memory leaks
        let clock = new THREE.Clock();
        let lastDamageTime = 0;
        let jumpRequested = false;
        let enemies = [], structures = [], bullets = [];
        const GRID_SIZE = 2;
        const GRAVITY = -0.015;
        let playerVelocityY = 0;

        const weapons = {
            pistol: { damage: 50, pellets: 1, spread: 0, color: 0x333333, size: [0.1, 0.1, 0.5] },
            shotgun: { damage: 20, pellets: 5, spread: 0.1, color: 0x222222, size: [0.15, 0.15, 0.6] },
            rifle: { damage: 35, pellets: 1, spread: 0.02, color: 0x444444, size: [0.1, 0.1, 0.8] }
        };


        // Referencias UI
        let mainDiv, settingsDiv, playBtn, openSettingsBtn, closeSettingsBtn;

        function handlePlay() {
            console.log("Play clicked");
            const menu = document.getElementById('main-menu');
            menu.classList.add('hidden');
            document.body.requestPointerLock();
            isLocked = true;
        }

        function handleSettings() {
            console.log("Settings clicked");
            const menu = document.getElementById('settings-menu');
            menu.classList.remove('hidden');
        }

        function handleCloseSettings() {
            console.log("Close settings clicked");
            const menu = document.getElementById('settings-menu');
            menu.classList.add('hidden');
        }

        document.addEventListener('pointerlockchange', () => {
            const menu = document.getElementById('main-menu');
            if (document.pointerLockElement === document.body) {
                isLocked = true;
                menu.classList.add('hidden');
            } else {
                isLocked = false;
                menu.classList.remove('hidden');
            }
        });

        function updateGhost() {
            ghostMesh.visible = isBuildingMode;
            if (!isBuildingMode) return;

            const dist = 3;
            const px = player.position.x - Math.sin(player.rotation.y) * dist;
            const pz = player.position.z - Math.cos(player.rotation.y) * dist;
            const sx = Math.round(px / GRID_SIZE) * GRID_SIZE;
            const sz = Math.round(pz / GRID_SIZE) * GRID_SIZE;

            ghostMesh.position.set(sx, 1, sz);

            // Snap rotation to 90 degrees (PI/2)
            const snappedRot = Math.round(player.rotation.y / (Math.PI / 2)) * (Math.PI / 2);
            ghostMesh.rotation.y = snappedRot;

            if(currentBuild === 'ramp') ghostMesh.rotation.x = -Math.PI/4;
            else ghostMesh.rotation.x = 0;

            ghostMesh.geometry = buildGeometries[currentBuild];
            ghostMesh.position.y = currentBuild === 'floor' ? 0.1 : 1;
        }

        function createPlayerModel() {
            const model = new THREE.Group();

            const skinMat = new THREE.MeshLambertMaterial({ color: 0xffdbac });
            const blackMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
            const whiteMat = new THREE.MeshLambertMaterial({ color: 0xeeeeee });
            const hairMat = new THREE.MeshLambertMaterial({ color: 0xadd8e6 });

            // Torso
            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.7, 0.3), blackMat);
            torso.position.y = 1.2;
            model.add(torso);

            // Head
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), skinMat);
            head.position.y = 1.7;
            head.visible = false; // Ocultar en primera persona
            model.add(head);

            // Hair
            const hair = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.15, 0.32), hairMat);
            hair.position.set(0, 1.8, 0);
            hair.visible = false; // Ocultar en primera persona
            model.add(hair);

            // Sunglasses
            const glasses = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.05, 0.05), blackMat);
            glasses.position.set(0, 1.72, -0.16);
            glasses.visible = false; // Ocultar en primera persona
            model.add(glasses);

            // Arms
            const armL = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.5, 0.15), blackMat);
            armL.position.set(-0.4, 1.2, 0);
            model.add(armL);
            const armR = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.5, 0.15), blackMat);
            armR.position.set(0.4, 1.2, 0);
            model.add(armR);

            // Legs
            const legL = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.8, 0.2), whiteMat);
            legL.position.set(-0.15, 0.5, 0);
            model.add(legL);
            const legR = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.8, 0.2), whiteMat);
            legR.position.set(0.15, 0.5, 0);
            model.add(legR);

            // Boots
            const bootL = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.2, 0.3), whiteMat);
            bootL.position.set(-0.15, 0.1, -0.05);
            model.add(bootL);
            const bootR = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.2, 0.3), whiteMat);
            bootR.position.set(0.15, 0.1, -0.05);
            model.add(bootR);

            return model;
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.Fog(0x87ceeb, 10, 150);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.domElement.style.position = 'absolute';
            renderer.domElement.style.top = '0';
            renderer.domElement.style.left = '0';
            renderer.domElement.style.zIndex = '0';
            document.body.appendChild(renderer.domElement);

            const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
            scene.add(hemi);
            const sun = new THREE.DirectionalLight(0xffffff, 1);
            sun.position.set(50, 100, 50);
            sun.castShadow = true;
            scene.add(sun);

            const terrainGeo = new THREE.PlaneGeometry(200, 200, 40, 40);
            const pos = terrainGeo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                let x = pos.getX(i);
                let z = pos.getZ(i);
                let h = Math.sin(x * 0.1) * Math.cos(z * 0.1) * 3 + Math.sin(x * 0.05) * 5;
                if (h < 0) h *= 0.2;
                pos.setZ(i, h);
            }
            terrainGeo.computeVertexNormals();
            const terrainMat = new THREE.MeshLambertMaterial({ color: 0x3a5a3a });
            const terrain = new THREE.Mesh(terrainGeo, terrainMat);
            terrain.rotation.x = -Math.PI / 2;
            terrain.receiveShadow = true;
            scene.add(terrain);

            const waterGeo = new THREE.PlaneGeometry(200, 200);
            const waterMat = new THREE.MeshPhongMaterial({ color: 0x0077be, transparent: true, opacity: 0.6 });
            const water = new THREE.Mesh(waterGeo, waterMat);
            water.rotation.x = -Math.PI / 2;
            water.position.y = -1;
            scene.add(water);

            for(let i=0; i<60; i++) {
                const treeType = Math.floor(Math.random() * 3);
                const tree = new THREE.Group();

                if(treeType === 0) { // Pino clásico
                    const trunk = new THREE.Mesh(new THREE.BoxGeometry(0.4, 2, 0.4), new THREE.MeshLambertMaterial({color: 0x5C4033}));
                    trunk.position.y = 1;
                    const foliage = new THREE.Mesh(new THREE.ConeGeometry(1.5, 3, 8), new THREE.MeshLambertMaterial({color: 0x228B22}));
                    foliage.position.y = 3;
                    tree.add(trunk, foliage);
                } else if(treeType === 1) { // Árbol frondoso
                    const trunk = new THREE.Mesh(new THREE.BoxGeometry(0.3, 2.5, 0.3), new THREE.MeshLambertMaterial({color: 0x4B3621}));
                    trunk.position.y = 1.25;
                    const foliage = new THREE.Mesh(new THREE.SphereGeometry(1.8, 8, 8), new THREE.MeshLambertMaterial({color: 0x2E8B57}));
                    foliage.position.y = 3;
                    tree.add(trunk, foliage);
                } else { // Árbol delgado/alto
                    const trunk = new THREE.Mesh(new THREE.BoxGeometry(0.2, 4, 0.2), new THREE.MeshLambertMaterial({color: 0x8B4513}));
                    trunk.position.y = 2;
                    const foliage = new THREE.Mesh(new THREE.ConeGeometry(0.8, 2, 6), new THREE.MeshLambertMaterial({color: 0x006400}));
                    foliage.position.y = 4;
                    tree.add(trunk, foliage);
                }

                tree.position.set(Math.random()*180-90, 0, Math.random()*180-90);
                scene.add(tree);
            }

            // Añadir Rocas
            for(let i=0; i<50; i++) {
                const size = Math.random() * 1.5 + 0.5;
                const rockGeo = new THREE.IcosahedronGeometry(size, 0);
                const rockMat = new THREE.MeshLambertMaterial({color: 0x808080});
                const rock = new THREE.Mesh(rockGeo, rockMat);

                rock.position.set(Math.random()*180-90, size/2, Math.random()*180-90);
                rock.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
                rock.scale.set(1, Math.random()*0.5 + 0.5, 1);

                scene.add(rock);
            }

            // Añadir Arbustos
            for(let i=0; i<80; i++) {
                const bushSize = Math.random() * 0.5 + 0.3;
                const bushGeo = new THREE.SphereGeometry(bushSize, 6, 6);
                const bushMat = new THREE.MeshLambertMaterial({color: 0x556B2F});
                const bush = new THREE.Mesh(bushGeo, bushMat);

                bush.position.set(Math.random()*180-90, bushSize/2, Math.random()*180-90);
                scene.add(bush);
            }

            player = new THREE.Group();
            player.position.set(0, 10, 0);
            scene.add(player);

            // Añadir el modelo del personaje
            const playerModel = createPlayerModel();
            playerModel.visible = false; // Ocultar el propio cuerpo para evitar clipping en primera persona
            player.add(playerModel);

            const cameraPivot = new THREE.Group();
            cameraPivot.position.y = 1.7; // Altura de los ojos
            player.add(cameraPivot);
            cameraPivot.add(camera);
            camera.position.set(0, 0, 0);

            gun = new THREE.Group();
            gun.position.set(0.3, -0.3, -0.6); // Posición más alejada para evitar cualquier clipping visual
            camera.add(gun);

            for(let i=0; i<15; i++) spawnEnemy();
            setWeapon('pistol');

            // Pre-create build geometries to avoid memory leaks
            buildGeometries = {
                wall: new THREE.BoxGeometry(GRID_SIZE, GRID_SIZE, 0.2),
                floor: new THREE.BoxGeometry(GRID_SIZE, 0.2, GRID_SIZE),
                ramp: new THREE.BoxGeometry(GRID_SIZE, 0.2, 3),
                cone: new THREE.ConeGeometry(1, 2, 4)
            };

            // Ghost Mesh for building preview
            ghostMesh = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.4 }));
            ghostMesh.visible = false;
            scene.add(ghostMesh);

            document.addEventListener('keydown', (e) => {
                if(e.code === 'KeyW') moveF = true;
                if(e.code === 'KeyS') moveB = true;
                if(e.code === 'KeyA') moveL = true;
                if(e.code === 'KeyD') moveR = true;
                if(e.code === 'ShiftLeft') isSprinting = true;
                if(e.code === 'ControlLeft') isCrouching = true;
                if(e.code === 'Space') {
                    jumpRequested = true;
                }
                if(e.code === 'KeyQ' && isBuildingMode) build();
                if(e.key === '1') setWeapon('pistol');
                if(e.key === '2') setWeapon('shotgun');
                if(e.key === '3') setWeapon('rifle');
                if(e.code === 'KeyZ') setBuild('wall');
                if(e.code === 'KeyX') setBuild('floor');
                if(e.code === 'KeyC') setBuild('ramp');
                if(e.code === 'KeyV') setBuild('cone');
            });
            document.addEventListener('keyup', (e) => {
                if(e.code === 'KeyW') moveF = false;
                if(e.code === 'KeyS') moveB = false;
                if(e.code === 'KeyA') moveL = false;
                if(e.code === 'KeyD') moveR = false;
                if(e.code === 'ShiftLeft') isSprinting = false;
                if(e.code === 'ControlLeft') isCrouching = false;
            });
            document.addEventListener('mousedown', (e) => {
                if(!isLocked) return;
                console.log("Mouse down, button:", e.button, "BuildingMode:", isBuildingMode);
                if(e.button === 0) shoot(); // Clic izquierdo: Disparar
                if(e.button === 2 && isBuildingMode) build(); // Clic derecho: Construir
            });
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('mousemove', (e) => {
                if(isLocked) {
                    const s = document.getElementById('sens-slider').value / 2500;
                    player.rotation.y -= e.movementX * s;
                    cameraPivot.rotation.x -= e.movementY * s;
                    cameraPivot.rotation.x = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, cameraPivot.rotation.x));
                }
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function setWeapon(type) {
            currentWeapon = type;
            isBuildingMode = false; // Desactivar modo construcción al elegir arma
            const w = weapons[type];

            // Limpiar arma anterior
            while(gun.children.length > 0) {
                const child = gun.children[0];
                if(child.geometry) child.geometry.dispose();
                if(child.material) child.material.dispose();
                gun.remove(child);
            }

            const mat = new THREE.MeshLambertMaterial({ color: w.color });
            const darkMat = new THREE.MeshLambertMaterial({ color: 0x111111 });

            if(type === 'pistol') {
                // Cuerpo
                const body = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.12, 0.2), mat);
                gun.add(body);
                // Cañón
                const barrel = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 0.2), mat);
                barrel.position.set(0, 0.03, -0.2);
                gun.add(barrel);
                // Empuñadura
                const grip = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.15, 0.07), darkMat);
                grip.position.set(0, -0.1, 0.05);
                grip.rotation.x = -0.2;
                gun.add(grip);
            } else if(type === 'shotgun') {
                // Cuerpo
                const body = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.15, 0.4), mat);
                gun.add(body);
                // Cañón ancho
                const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.4, 8), mat);
                barrel.rotation.x = Math.PI/2;
                barrel.position.set(0, 0.05, -0.4);
                gun.add(barrel);
                // Culata
                const stock = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.15, 0.3), darkMat);
                stock.position.set(0, -0.05, 0.3);
                gun.add(stock);
            } else if(type === 'rifle') {
                // Cuerpo largo
                const body = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.12, 0.6), mat);
                gun.add(body);
                // Cañón largo
                const barrel = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 0.4), mat);
                barrel.position.set(0, 0, -0.5);
                gun.add(barrel);
                // Mira
                const scope = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.15, 8), darkMat);
                scope.rotation.x = Math.PI/2;
                scope.position.set(0, 0.1, -0.1);
                gun.add(scope);
                // Culata
                const stock = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.12, 0.3), darkMat);
                stock.position.set(0, -0.05, 0.4);
                gun.add(stock);
            }

            // Actualizar UI
            document.querySelectorAll('.inv-slot').forEach(s => s.classList.remove('active'));
            const slotId = type === 'pistol' ? 'slot-1' : type === 'shotgun' ? 'slot-2' : 'slot-3';
            document.getElementById(slotId).classList.add('active');
        }

        function setBuild(type) {
            currentBuild = type;
            isBuildingMode = true; // Activar modo construcción y mostrar ghost
            const names = {wall:'Pared', floor:'Suelo', ramp:'Rampa', cone:'Cono'};
            document.getElementById('build-name').innerText = names[type];
            document.querySelectorAll('.build-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + type).classList.add('active');
        }


        function spawnEnemy() {
            const types = [
                { color: 0xff0000, size: 1, speed: 0.02, hp: 100 },
                { color: 0x0000ff, size: 0.7, speed: 0.06, hp: 60 },
                { color: 0x4b0082, size: 1.5, speed: 0.01, hp: 200 }
            ];
            const t = types[Math.floor(Math.random() * types.length)];
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(t.size, t.size*2, t.size), new THREE.MeshLambertMaterial({color: t.color}));
            body.position.y = t.size;
            group.add(body);
            const head = new THREE.Mesh(new THREE.BoxGeometry(t.size*0.6, t.size*0.6, t.size*0.6), new THREE.MeshLambertMaterial({color: 0xffdbac}));
            head.position.y = t.size*2 + 0.3;
            group.add(head);
            group.position.set(Math.random()*100-50, 0, Math.random()*100-50);
            group.userData = { speed: t.speed, health: t.hp };
            scene.add(group);
            enemies.push(group);
        }

        function takeDamage(amount) {
            lastDamageTime = Date.now();
            shield -= amount;
            if(shield < 0) {
                health += shield; // apply remaining damage to health
                shield = 0;
            }

            // Update UI
            document.getElementById('health-bar').style.width = Math.max(0, health) + '%';
            document.getElementById('shield-bar').style.width = Math.max(0, shield) + '%';

            // Visual feedback: Red flash
            document.getElementById('hud').style.backgroundColor = 'rgba(255,0,0,0.2)';
            setTimeout(() => { document.getElementById('hud').style.backgroundColor = 'transparent'; }, 100);

            if(health <= 0) {
                document.getElementById('final-stats').innerText = 'Kills: ' + kills;
                document.getElementById('game-over').classList.remove('hidden');
                document.exitPointerLock();
            }
        }

        function shoot() {
            // Recoil effect
            gun.position.z = -0.4;
            gun.rotation.x = -0.1;
            setTimeout(() => {
                gun.position.z = -0.6;
                gun.rotation.x = 0;
            }, 100);

            const w = weapons[currentWeapon];

            for(let i=0; i < w.pellets; i++) {
                const dir = new THREE.Vector3();
                camera.getWorldDirection(dir);

                dir.x += (Math.random() - 0.5) * w.spread;
                dir.y += (Math.random() - 0.5) * w.spread;
                dir.normalize();

                const bGeo = new THREE.SphereGeometry(0.05, 8, 8);
                const bMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
                const bMesh = new THREE.Mesh(bGeo, bMat);

                const startPos = new THREE.Vector3();
                gun.getWorldPosition(startPos);
                bMesh.position.copy(startPos);

                scene.add(bMesh);
                bullets.push({
                    mesh: bMesh,
                    dir: dir.clone(),
                    life: 60
                });

                const camPos = new THREE.Vector3();
                camera.getWorldPosition(camPos);
                const ray = new THREE.Raycaster(camPos, dir);

                // Check for enemy hits
                const hits = ray.intersectObjects(enemies, true);
                if(hits.length > 0) {
                    let obj = hits[0].object;
                    while(obj.parent && obj.parent !== scene) obj = obj.parent;

                    // Hit flash
                    const originalColor = obj.children[0].material.color.clone();
                    obj.children[0].material.color.set(0xffffff);
                    setTimeout(() => { obj.children[0].material.color.copy(originalColor); }, 50);

                    obj.userData.health -= w.damage;
                    if(obj.userData.health <= 0) {
                        scene.remove(obj);
                        enemies = enemies.filter(e => e !== obj);
                        spawnEnemy();
                    }
                }

                // Check for structure hits
                const sHits = ray.intersectObjects(structures, true);
                if(sHits.length > 0) {
                    let sObj = sHits[0].object;

                    // Hit flash
                    const originalColor = sObj.material.color.clone();
                    sObj.material.color.set(0xffffff);
                    setTimeout(() => { sObj.material.color.copy(originalColor); }, 50);

                    sObj.userData.health -= w.damage;
                    if(sObj.userData.health <= 0) {
                        scene.remove(sObj);
                        structures = structures.filter(s => s !== sObj);
                    }
                }
            }
        }

        function build() {
            console.log("Attempting to build...");
            if(materials < 10) {
                console.log("Not enough materials");
                return;
            }

            const pos = ghostMesh.position.clone();
            const rot = ghostMesh.rotation.clone();

            // Evitar superposición (Overlap check incluyendo altura Y)
            for(let s of structures) {
                const dx = Math.abs(s.position.x - pos.x);
                const dz = Math.abs(s.position.z - pos.z);
                const dy = Math.abs(s.position.y - pos.y);
                if(dx < 0.5 && dz < 0.5 && dy < 0.5) {
                    console.log("Overlap detected");
                    return;
                }
            }

            let geo, mat = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
            let mesh = new THREE.Mesh();
            let height = 0;
            if(currentBuild === 'wall') {
                geo = new THREE.BoxGeometry(GRID_SIZE, GRID_SIZE, 0.2);
                mesh = new THREE.Mesh(geo, mat);
                height = 2;
            } else if(currentBuild === 'floor') {
                geo = new THREE.BoxGeometry(GRID_SIZE, 0.2, GRID_SIZE);
                mesh = new THREE.Mesh(geo, mat);
                height = 0.2;
            } else if(currentBuild === 'ramp') {
                geo = new THREE.BoxGeometry(GRID_SIZE, 0.2, 3);
                mesh = new THREE.Mesh(geo, mat);
                height = 2;
            } else {
                geo = new THREE.ConeGeometry(1, 2, 4);
                mesh = new THREE.Mesh(geo, mat);
                height = 2;
            }
            mesh.position.copy(pos);
            mesh.rotation.copy(rot);
            mesh.userData = { height: height, type: currentBuild, health: 100 };
            scene.add(mesh);
            structures.push(mesh);
            materials -= 10;
            document.getElementById('mats').innerText = materials;
            console.log("Built successfully");
        }

        function getTerrainHeight(x, z) {
            let h = Math.sin(x * 0.1) * Math.cos(z * 0.1) * 3 + Math.sin(x * 0.05) * 5;
            if (h < 0) h *= 0.2;
            return h;
        }

        function checkCollision(nx, nz, y) {
            const pos = new THREE.Vector3(nx, y, nz);
            for(let s of structures) {
                if(s.userData.type === 'floor') continue; // Floors don't block horizontal movement

                // Transform position to structure's local space to handle rotation accurately
                const localPos = s.worldToLocal(pos.clone());

                const params = s.geometry.parameters;
                if(!params) continue;

                const halfW = (params.width || 0) / 2;
                const halfH = (params.height || 0) / 2;
                const halfD = (params.depth || 0) / 2;

                // Basic AABB check in local space (with a small player radius)
                const playerRadius = 0.3;
                if(Math.abs(localPos.x) < halfW + playerRadius && Math.abs(localPos.z) < halfD + playerRadius) {
                    const topY = s.position.y + halfH;
                    // Collide if the player's base is below the top of the structure
                    if(y < topY - 0.1) return s;
                }
            }
            return null;
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const frameScale = delta * 60; // Normalize to 60fps for easier speed adjustment
            if(isLocked) {
                updateGhost();
                const terrainH = getTerrainHeight(player.position.x, player.position.z);

                // Gravedad y Suelo
                let currentGround = terrainH;
                for(let s of structures) {
                    if(Math.abs(player.position.x - s.position.x) < 1.1 && Math.abs(player.position.z - s.position.z) < 1.1) {
                        const topY = s.position.y + (s.userData.height / 2);
                        if(player.position.y >= topY - 0.2) {
                            currentGround = Math.max(currentGround, topY);
                        }
                    }
                }

                playerVelocityY += GRAVITY * frameScale;
                player.position.y += playerVelocityY * frameScale;

                if (player.position.y < currentGround) {
                    player.position.y = currentGround;
                    playerVelocityY = 0;
                }

                if(jumpRequested) {
                    if(player.position.y <= currentGround + 0.01) {
                        playerVelocityY = 0.3;
                    }
                    jumpRequested = false;
                }

                // Shield regeneration
                if(Date.now() - lastDamageTime > 5000 && shield < 100) {
                    shield += 0.05 * frameScale;
                    if(shield > 100) shield = 100;
                    document.getElementById('shield-bar').style.width = shield + '%';
                }

                const speed = 0.12;
                let nextX = player.position.x;
                let nextZ = player.position.z;

                if(moveF) { nextX -= Math.sin(player.rotation.y) * speed * frameScale; nextZ -= Math.cos(player.rotation.y) * speed * frameScale; }
                if(moveB) { nextX += Math.sin(player.rotation.y) * speed * frameScale; nextZ += Math.cos(player.rotation.y) * speed * frameScale; }
                if(moveL) { nextX -= Math.cos(player.rotation.y) * speed * frameScale; nextZ += Math.sin(player.rotation.y) * speed * frameScale; }
                if(moveR) { nextX += Math.cos(player.rotation.y) * speed * frameScale; nextZ -= Math.sin(player.rotation.y) * speed * frameScale; }

                // Efecto de balanceo del arma (Sway/Bobbing)
                if(moveF || moveB || moveL || moveR) {
                    const t = Date.now() * 0.008;
                    gun.position.y = -0.3 + Math.sin(t) * 0.04;
                    gun.position.x = 0.3 + Math.cos(t * 0.5) * 0.04;
                    gun.rotation.z = Math.sin(t * 0.5) * 0.05;
                } else {
                    gun.position.y = THREE.MathUtils.lerp(gun.position.y, -0.3, 0.1);
                    gun.position.x = THREE.MathUtils.lerp(gun.position.x, 0.3, 0.1);
                    gun.rotation.z = THREE.MathUtils.lerp(gun.rotation.z, 0, 0.1);
                }

                // Colisión X
                const colX = checkCollision(nextX, player.position.z, player.position.y);
                if(!colX) {
                    player.position.x = nextX;
                } else if(colX.position.y + (colX.userData.height / 2) < player.position.y + 0.6) {
                    // Paso automático (Step up)
                    player.position.y = colX.position.y + (colX.userData.height / 2);
                    player.position.x = nextX;
                }

                // Colisión Z
                const colZ = checkCollision(player.position.x, nextZ, player.position.y);
                if(!colZ) {
                    player.position.z = nextZ;
                } else if(colZ.position.y + (colZ.userData.height / 2) < player.position.y + 0.6) {
                    // Paso automático (Step up)
                    player.position.y = colZ.position.y + (colZ.userData.height / 2);
                    player.position.z = nextZ;
                }
            }

            // Actualizar Balas
            for(let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.mesh.position.addScaledVector(b.dir, 1.5 * frameScale);
                b.life -= frameScale;
                if(b.life <= 0) {
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                }
            }

            enemies.forEach(e => {
                // Move towards player
                const dir = new THREE.Vector3().subVectors(player.position, e.position);
                dir.y = 0;
                dir.normalize();

                const nextX = e.position.x + dir.x * e.userData.speed * frameScale;
                const nextZ = e.position.z + dir.z * e.userData.speed * frameScale;

                // Collision check for enemy
                if(!checkCollision(nextX, nextZ, e.position.y)) {
                    e.position.x = nextX;
                    e.position.z = nextZ;
                }

                // Keep enemy on terrain/structures
                const terrainH = getTerrainHeight(e.position.x, e.position.z);
                let currentEnemyGround = terrainH;
                for(let s of structures) {
                    if(Math.abs(e.position.x - s.position.x) < 1.1 && Math.abs(e.position.z - s.position.z) < 1.1) {
                        const topY = s.position.y + (s.userData.height / 2);
                        if(e.position.y >= topY - 0.2) {
                            currentEnemyGround = Math.max(currentEnemyGround, topY);
                        }
                    }
                }
                e.position.y = currentEnemyGround;

                e.lookAt(player.position.x, e.position.y, player.position.z);

                // Attack player if close enough
                const dist = e.position.distanceTo(player.position);
                if(dist < 2) {
                    takeDamage(0.1 * frameScale); // Continuous damage when touching
                }
            });
            renderer.render(scene, camera);
        }

        window.onload = () => { init(); animate(); };
    </script>
</body>
